{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="panel"><h1>{{ message }}</h1>{% if detail %}<p>{{ detail }}</p>{% endif %}
<p><a class="btn" href="{{ url_for('auth.home') }}">Go to your start page</a></p></div>
{% endblock %}
{% block public %}
<div class="auth"><div class="auth-card"><h1>{{ message }}</h1>{% if detail %}<p>{{ detail }}</p>{% endif %}
<p><a class="btn primary" href="{{ url_for('auth.login') }}">Log in</a></p></div></div>
{% endblock %}
